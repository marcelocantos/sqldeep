# hygiene.yaml — declared, drift-validated hygiene posture for sqldeep.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`.
#
# Tiers are PER DIMENSION (schema v1): a dimension's held tier is the highest T
# such that every item in it with `tier <= T` is satisfied. `floors` is the
# per-dimension ratchet (below floor => DRIFT); `aspires` is the gap horizon;
# `enforce` is intent-only and does not affect tiers.
#
# Headline CI is `cv test` on ubuntu-latest + macos-latest. Go / Swift / Kotlin
# binding suites exist but are local/opt-in and are not the shipped gate.

schema_version: 1

repo: sqldeep
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 1   # cv test in CI (ubuntu + macos); bindings/examples not CI
  security: 2      # GitHub secret scanning + push protection
  quality: 0       # -Wall in cvfile; no format/lint gate
  deps: 1          # vendored sqlite/doctest + deepparser submodule; no dependabot
  release: 2       # tag-triggered multi-arch tarball + Homebrew
  governance: 2    # Apache-2.0 + README + .gitignore + squash-only
  build: 2         # cvfile + CI `cv test` with recursive submodules
  docs: 1          # README + STABILITY.md + agent guide; no doc CI
  perf: 0
  vcs: 0
  agent: 2         # CLAUDE.md, agents-guide, bullseye.yaml

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # full matrix, examples run, lint/format, release + governance
  3: hardened    # formal specs, security scanning, SBOM/signing, fuzzing, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.ci-tests
    dim: correctness
    desc: cv test runs on every push/PR (ubuntu-latest and macos-latest)
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {ci_job: ci.yml#test}

  - id: correctness.testdata
    dim: correctness
    desc: YAML golden corpora drive the C++ doctest suite (transpile + sqlite)
    state: present
    cadence: continuous
    enforce: blocking
    tier: 1
    evidence: {file: {path: testdata/transpile.yaml}}

  - id: correctness.os-matrix
    dim: correctness
    desc: CI test job includes macos-latest as well as ubuntu-latest
    state: present
    cadence: continuous
    enforce: warning
    tier: 2
    evidence: {file: {path: .github/workflows/ci.yml, matches: 'macos-latest'}}

  - id: correctness.release-tests
    dim: correctness
    desc: Release job runs cv test before packaging binaries
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_step: {workflow: release.yml, name: Run tests}}

  - id: correctness.examples-ci
    dim: correctness
    desc: cv example (examples/demo.cpp) compiles and runs in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: cvfile has !example; CI only runs cv test. Demo is local/opt-in.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: Run examples}}}

  - id: correctness.bindings-ci
    dim: correctness
    desc: Go / Swift / Kotlin binding suites run in CI, not only locally
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: >-
      Binding tests exist (go/sqldeep, swift/Tests, kotlin) and share
      testdata/sqlite.yaml, but CI is the C++ `cv test` gate only.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: 'go test'}}}

  - id: correctness.sanitizers
    dim: correctness
    desc: ASan+UBSan job over the C++ suite / C runtime
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: No sanitizer job or -fsanitize flags in ci.yml / cvfile.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: 'fsanitize'}}}

  - id: correctness.fuzzing
    dim: correctness
    desc: Fuzz harness over transpile input / XML runtime
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: >-
      No fuzz/ tree in this repo; vendor/deepparser has its own fuzz targets
      which are not a sqldeep gate.
    evidence: {absent: {file: {path: fuzz}}}

  - id: correctness.postgres-live
    dim: correctness
    desc: PostgreSQL backend is executed, not only string-compared
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: testdata expected_postgres is string compare; no live Postgres job.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: 'postgres'}}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.github-secret-scan
    dim: security
    desc: GitHub secret scanning enabled on the repo
    state: present
    cadence: continuous
    enforce: warning
    tier: 2
    evidence:
      {gh_setting: {key: security_and_analysis.secret_scanning.status, equals: enabled}}

  - id: security.push-protection
    dim: security
    desc: GitHub secret-scanning push protection enabled
    state: present
    cadence: continuous
    enforce: warning
    tier: 2
    evidence:
      {gh_setting: {key: security_and_analysis.secret_scanning_push_protection.status, equals: enabled}}

  - id: security.gitleaks
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 3
    reason: Relying on GitHub native secret scanning; no gitleaks config or CI job.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.sast-codeql
    dim: security
    desc: CodeQL static analysis for C/C++
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: No CodeQL workflow; compiler warnings are the only static check.
    evidence: {absent: {file: {path: .github/workflows/codeql.yml}}}

  - id: security.dep-vuln-scan
    dim: security
    desc: Vulnerability scanning of vendored SQLite / Go test modules
    state: planned
    cadence: periodic:30d
    enforce: warning
    tier: 3
    reason: Vendored sqlite3.c + go-sqlite3/yaml.v3 have no osv-scanner/advisory job.
    evidence: {absent: {scanner: {tool: osv-scanner}}}

  - id: security.signed-releases
    dim: security
    desc: Release artifacts are checksummed and/or signed (cosign/sigstore)
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: release.yml uploads tarballs and sets skip_checksum true; no signing step.
    evidence: {absent: {ci_step: {workflow: release.yml, name: Sign}}}

  - id: security.release-perms
    dim: security
    desc: Release workflow token permissions are scoped (contents write)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 3
    evidence:
      {file: {path: .github/workflows/release.yml, matches: '(?m)^permissions:'}}

  - id: security.ci-perms
    dim: security
    desc: CI workflow default token permissions are read-only
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 3
    reason: ci.yml has no top-level permissions block; inherits repo default.
    evidence:
      {absent: {file: {path: .github/workflows/ci.yml, matches: '(?m)^permissions:'}}}

  # ============================== CODE QUALITY ============================
  - id: quality.format
    dim: quality
    desc: Sources are clang-format clean, enforced in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: No .clang-format; formatting is by-hand.
    evidence: {absent: {file: {path: .clang-format}}}

  - id: quality.lint
    dim: quality
    desc: clang-tidy (or equivalent) runs in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: No .clang-tidy and no lint step in ci.yml. cvfile uses -Wall -Wextra -Wpedantic without -Werror.
    evidence: {absent: {file: {path: .clang-tidy}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.vendored
    dim: deps
    desc: SQLite amalgamation is vendored (not an unpinned system package)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: vendor/src/sqlite3.c}}

  - id: deps.notices
    dim: deps
    desc: NOTICES records third-party components (doctest, SQLite, fkYAML)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: NOTICES, matches: 'SQLite'}}

  - id: deps.submodule
    dim: deps
    desc: deepparser is a pinned git submodule on branch sqldeep-grammar
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitmodules, matches: 'vendor/deepparser'}}

  - id: deps.dependabot
    dim: deps
    desc: Dependabot (or equivalent) watches Actions, Go modules, and the submodule
    state: planned
    cadence: periodic:30d
    enforce: informational
    tier: 2
    reason: No .github/dependabot.yml; Actions pins, go/sqldeep requires, and deepparser are unwatched.
    evidence: {absent: {file: {path: .github/dependabot.yml}}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.version-macros
    dim: release
    desc: SQLDEEP_VERSION macros live in dist/sqldeep.h
    state: present
    cadence: per-release
    enforce: warning
    tier: 1
    evidence: {file: {path: dist/sqldeep.h, matches: '#define SQLDEEP_VERSION'}}

  - id: release.ci-built
    dim: release
    desc: Release binaries are built by CI (darwin-arm64, linux-amd64, linux-arm64)
    state: present
    cadence: per-release
    enforce: warning
    tier: 2
    evidence: {ci_job: release.yml#build}

  - id: release.homebrew
    dim: release
    desc: Published to the Homebrew tap on release
    state: present
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {ci_job: release.yml#homebrew}

  - id: release.semver-minor
    dim: release
    desc: Latest v* git tag is MINOR-only (PATCH == 0)
    state: enforced
    cadence: per-release
    enforce: blocking
    tier: 2
    evidence:
      command: >-
        test "$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1 | sed 's/^v//' | awk -F. '{print $3}')" = "0"

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible changes per release
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: History lives in git and GitHub release notes; no CHANGELOG.md.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.license
    dim: governance
    desc: Apache-2.0 LICENSE present
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: LICENSE, matches: 'Apache License'}}

  - id: governance.readme
    dim: governance
    desc: README present and current
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers build/, .cv/, binding caches, and IDE/OS files
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: .gitignore, matches: 'build/'}}

  - id: governance.spdx
    dim: governance
    desc: Public C/C++ sources carry SPDX-License-Identifier Apache-2.0
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: dist/sqldeep.h, matches: 'SPDX-License-Identifier: Apache-2.0'}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only, with delete-branch-on-merge
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy yet.
    evidence: {absent: {file: {path: SECURITY.md}}}

  - id: governance.branch-protection
    dim: governance
    desc: Default branch (master) is protected with required checks
    state: planned
    cadence: once-must-hold
    enforce: blocking
    tier: 3
    reason: gh api branches/master/protection returns 404; no required CI.
    evidence: {absent: {gh_setting: {key: protected, equals: true}}}

  # ================================= BUILD ===============================
  - id: build.cvfile
    dim: build
    desc: Root cvfile declares !test / !lib / !example / !shell
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: cvfile, matches: '!test:'}}

  - id: build.cxx20
    dim: build
    desc: Library build requires C++20
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: cvfile, matches: '-std=c[+][+]20'}}

  - id: build.ci
    dim: build
    desc: CI installs cv and runs cv test
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence: {ci_step: {workflow: ci.yml, name: Build and run tests}}

  - id: build.submodules
    dim: build
    desc: CI checks out vendor/deepparser recursively
    state: present
    cadence: continuous
    enforce: warning
    tier: 2
    evidence: {file: {path: .github/workflows/ci.yml, matches: 'submodules: recursive'}}

  - id: build.pinned-runners
    dim: build
    desc: CI pins runner images (not ubuntu-latest / macos-latest)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 3
    reason: ci.yml and release.yml use ubuntu-latest / macos-latest floating tags.
    evidence: {absent: {file: {path: .github/workflows/ci.yml, matches: 'ubuntu-\\d+\\.\\d+'}}}

  # ============================ DOCUMENTATION ============================
  - id: docs.stability
    dim: docs
    desc: STABILITY.md catalogues the pre-1.0 interaction surface
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: STABILITY.md}}

  - id: docs.agents-guide
    dim: docs
    desc: dist/sqldeep-agents-guide.md documents embed/FFI for agents
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 1
    evidence: {file: {path: dist/sqldeep-agents-guide.md}}

  - id: docs.contributing
    dim: docs
    desc: CONTRIBUTING.md documents clone, test, and PR flow
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 2
    reason: README covers cv test / cv example; no CONTRIBUTING.md.
    evidence: {absent: {file: {path: CONTRIBUTING.md}}}

  - id: docs.md-links
    dim: docs
    desc: Internal markdown links resolve (no dead cross-references)
    state: planned
    cadence: continuous
    enforce: informational
    tier: 2
    reason: No link-checker job or cv target; docs are reviewed by hand.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: Check markdown links}}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Benchmark suite for transpile throughput
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: No benches/ or timed cv target; performance is not tracked.
    evidence: {absent: {file: {path: benches}}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.claude-md
    dim: agent
    desc: CLAUDE.md present (conventions discoverable by agents)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: CLAUDE.md}}

  - id: agent.agents-guide
    dim: agent
    desc: Agent guide is in-tree and embedded in the CLI (-help-agent)
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: cmd/sqldeep.c, matches: 'sqldeep_print_agent_guide'}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: present
    cadence: once-must-hold
    enforce: informational
    tier: 2
    evidence: {file: {path: bullseye.yaml}}

  - id: agent.agents-md
    dim: agent
    desc: AGENTS.md present as the multi-tool project instruction file
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Project instructions live in CLAUDE.md only; no AGENTS.md.
    evidence: {absent: {file: {path: AGENTS.md}}}
