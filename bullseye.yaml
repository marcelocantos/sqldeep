    name: The sqldeep CLI surfaces transform errors instead of falling through to a misleading raw-SQL parse error
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 2.0
    attestation: CLI shell_exec holds sdErr on transpile failure and surfaces it when raw sqlite3_prepare_v2 also fails (transform rejections); discards on successful prepare (EXPLAIN/raw SQL fallthrough). Covered by test_c_api.cpp T6 CLI cases. cv test green (795 assertions).
    acceptance:
    - 'Running a sqldeep query in the CLI that parses as sqldeep but is rejected by the transformer (e.g. `FROM t WHERE a = ? SELECT { b: ? }` positional-param reorder, or `SELECT { orders_id } FROM x->orders` unknown alias) prints the sqldeep transform error message, not a generic SQLite ''syntax error / unrecognized token'' message'
    - Genuine non-sqldeep input (dot commands, raw SQL, EXPLAIN) still falls through to raw execution unchanged
    - Covered by a CLI-level test
    context: |-
      vendor/src/shell.c (~line 24647) discards the sqldeep error (sdErr) on any transpile failure and falls through to raw SQL, so transform-stage errors surface as confusing SQLite parse errors. Discovered while adding positional-parameter order-preservation (the new guard's clear message is lost in the CLI). The fix must distinguish a parse failure (should fall through) from a transform rejection (should surface) — the C API does not currently expose which stage failed, so this may need an API or heuristic (e.g. surface sdErr only when the raw prepare also fails). Entropy-audit ENT-010 (P2) reconfirms this on vendor/src/shell.c:24632-24649. Combined with 🎯T7.3 / ENT-003, some failures are success (empty SQL) and never reach this branch; others become a SQLite syntax error that hides the transformer message. Report: docs/audits/entropy-audit-2026-08-22.md.

