# bullseye.yaml — convergence targets for this project.
#
# Targets are desired project states expressed as testable properties,
# with dependency tracking and frontier computation. This file is the
# source of truth: read and written by the bullseye MCP server.
#
# AGENT RULE: Do NOT edit this file directly unless the user explicitly
# instructs you to, or the file is unloadable and you are performing an
# emergency repair. Prefer Bullseye MCP/CLI mutation tools (open/query/
# commit). Direct edits are detected via content_hash below.
#
# What is bullseye / how do I install it?
#   https://github.com/marcelocantos/bullseye
#
# This banner is regenerated by bullseye on every write — edit targets
# only through tools, not these lines.
# content_hash: sha256:43a7f9cca83dc9e1f00c0cc527a97cab2df210be63caf4a5763fa2e137b4b85f

schema_version: 5
targets:
  T1:
    name: sqldeep reaches v1.0.0 with all syntax and API surfaces declared stable
    status: converging
    value: 13.0
    cost: 3.0
    acceptance:
    - All items in STABILITY.md are marked Stable (no Experimental or Needs review remaining)
    - STABILITY.md Gaps and prerequisites section is resolved or moved to Out of scope
    - Settling threshold met (N consecutive minor releases with zero breaking changes)
    - Version macros in sqldeep.h read 1.0.0
    - sqldeep_version() returns 1.0.0
    - 'GitHub issue #10 is closed (resolved by computed key syntax)'
    - Tagged release v1.0.0 exists on GitHub
    context: v0.7.0 introduced Experimental items (SQL comments, -> FROM-context restriction, ->> passthrough) and a breaking change (removed // comments). v0.8.0 adds recursive select (also Experimental). The settling clock requires these features to prove out through real-world usage before promotion to Stable. Currently at v0.21.0 with ~45 Experimental items across C API, Go/Swift/Kotlin bindings, input syntax, output semantics, and parser behaviour.
    origin: targets.md bootstrap
    discovered: 2026-04-08
  T15:
    name: RECURSE rejects a non-integer primary key instead of silently collapsing the DFS path key
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - A RECURSE query whose PK column holds TEXT values either errors or produces correctly nested JSON; it never emits sibling fragments in the wrong order
    - testdata/sqlite.yaml carries a TEXT-PK RECURSE case asserting that behaviour
    - STABILITY.md states the RECURSE PK contract that the implementation actually enforces
    context: ENT-004 follow-up. The DFS path key is now sign- and width-safe for integers (commit d760f96), so negative and 64-bit PKs nest correctly. A TEXT PK still passes through printf('%019d', pk), which SQLite evaluates to 0 for every non-numeric string, so all siblings collide on one sort key and nest arbitrarily. The audit asked for non-integer PKs to be rejected explicitly; that cannot be decided at transpile time from the AST alone, so it needs either a runtime guard in the emitted SQL (typeof(pk)) or a documented, enforced contract.
    tags:
    - fable-audit
    - entropy-audit
    origin: manual
    discovered: 2026-09-06
  T16:
    name: cv's incremental state never serves a stale object, so a green test run always reflects the source on disk
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - Restoring an earlier version of dist/sqldeep.cpp with git checkout, running cv test, then restoring the newer version and running cv test again yields results matching each source version
    - The failure mode is either fixed in cv or documented in CLAUDE.md with the command that recovers a trustworthy build
    context: Observed 2026-09-06 while verifying the ENT-002/ENT-004 fix. After `git checkout HEAD -- dist/sqldeep.cpp`, a cv test run, and restoring the newer file, cv relinked build/sqldeep_tests but kept the stale build/sqldeep.o even after `touch` on the source and `rm build/sqldeep.o`. The suite reported 654 assertions with 11 failures against a source tree that compiles to 756 passing. Removing .cv/state.json restored correct behaviour. A build cache that can serve a stale object turns the project's only gate into an unreliable oracle.
    tags:
    - build
    - verification
    origin: manual
    discovered: 2026-09-06
