  T5:
    name: SQLite-backend transpile parses input via deepparser AST instead of the hand-written parser
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    attestation: 'Original deepparser SQLite migration remains landed (2026-05-20). Context/acceptance refreshed 2026-08-23 for T11: all backends use deepparser; PostgreSQL documented as transpile-only (not unused). Hand-written-PG-parser acceptance sentence removed as false.'
    acceptance:
    - sqldeep_transpile_backend(SQLDEEP_SQLITE) parses input via lp_parse_all and walks the resulting AST to produce output, instead of the hand-written recursive-descent parser in dist/sqldeep.cpp
    - sqldeep_transpile_backend(SQLDEEP_SQLITE_VANILLA) shares the deepparser-based path with a different JSON-function emitter table
    - The CTE input 'WITH s AS (SELECT COUNT(*) AS c FROM messages) SELECT c FROM s' round-trips through Transpile unchanged (modulo whitespace canonicalization)
    - 'Existing tests in tests/test_transpile.cpp and tests/test_sqlite.cpp pass (expected outputs may be updated to match deepparser canonical SQL form: normalised whitespace, comma-joins expanded to INNER JOIN, etc.)'
    - All backends (SQLDEEP_SQLITE, SQLDEEP_SQLITE_VANILLA, SQLDEEP_POSTGRES) route through deepparser; the hand-written parser is removed (STABILITY.md Deepparser-backed parser). PostgreSQL remains transpile-only (string goldens), not a live runtime backend — 🎯T11.
    - Plain-SQL forms not previously supported (window functions, lateral joins, CTEs, RETURNING with extras, etc.) round-trip via the SQLite backend without errors
    context: |-
      Replaces the original 'fix the CTE paren bug' framing. The CTE bug (unmatched paren on plain SQL) was a symptom of sqldeep's hand-written parser doing partial parsing — scanning tokens for sqldeep triggers while approximately tracking SQL state. Every exotic plain-SQL form (windows, lateral, etc.) is a latent bug of the same shape. The durable fix is a real SQL parser. After evaluating options, decision was to fork sqliteai/liteparser as marcelocantos/deepparser (vendored as submodule at vendor/deepparser/), extend its Lemon grammar with sqldeep productions, and replace the hand-written parser for all backends. Achieved 2026-05-20 for SQLite; subsequently all backends (including SQLDEEP_POSTGRES) parse via deepparser (STABILITY.md Deepparser-backed parser). PostgreSQL remains a transpile-only product claim (expected_postgres string goldens; no PG execution oracle) — see 🎯T11 / ENT-013. See vendor/deepparser/bullseye.yaml T1 for the deepparser-side work: grammar extensions, AST kinds, unparse handlers, round-trip parity.

      Achieved 2026-08-23: Original deepparser SQLite migration remains landed (2026-05-20). Context/acceptance refreshed 2026-08-23 for T11: all backends use deepparser; PostgreSQL documented as transpile-only (not unused). Hand-written-PG-parser acceptance sentence removed as false.
    origin: manual
    discovered: 2026-05-13
    achieved: 2026-08-23
