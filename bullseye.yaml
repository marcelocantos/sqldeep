  T5:
    name: SQLite-backend transpile parses input via deepparser AST instead of the hand-written parser
    status: achieved
    value: 0.0
    cost: 0.0
    actual_cost: 5.0
    acceptance:
    - sqldeep_transpile_backend(SQLDEEP_SQLITE) parses input via lp_parse_all and walks the resulting AST to produce output, instead of the hand-written recursive-descent parser in dist/sqldeep.cpp
    - sqldeep_transpile_backend(SQLDEEP_SQLITE_VANILLA) shares the deepparser-based path with a different JSON-function emitter table
    - The CTE input 'WITH s AS (SELECT COUNT(*) AS c FROM messages) SELECT c FROM s' round-trips through Transpile unchanged (modulo whitespace canonicalization)
    - 'Existing tests in tests/test_transpile.cpp and tests/test_sqlite.cpp pass (expected outputs may be updated to match deepparser canonical SQL form: normalised whitespace, comma-joins expanded to INNER JOIN, etc.)'
    - The hand-written parser remains in the codebase only for the PostgreSQL backend (marked as legacy path in STABILITY.md and source); SQLite paths route through deepparser exclusively
    - Plain-SQL forms not previously supported (window functions, lateral joins, CTEs, RETURNING with extras, etc.) round-trip via the SQLite backend without errors
    context: 'Replaces the original ''fix the CTE paren bug'' framing. The CTE bug (unmatched paren on plain SQL) was a symptom of sqldeep''s hand-written parser doing partial parsing — scanning tokens for sqldeep triggers while approximately tracking SQL state. Every exotic plain-SQL form (windows, lateral, etc.) is a latent bug of the same shape. The durable fix is a real SQL parser. After evaluating options, decision was to fork sqliteai/liteparser as marcelocantos/deepparser (vendored as submodule at vendor/deepparser/), extend its Lemon grammar with sqldeep productions, and replace sqldeep parser entirely for SQLite backends. PG backend stays on the hand-written parser for now (separately tracked, sqldeep PG path is unused). See vendor/deepparser/bullseye.yaml T1 for the deepparser-side work: grammar extensions, AST kinds, unparse handlers, round-trip parity.'
    origin: manual
    discovered: 2026-05-13
    achieved: 2026-05-20
  T6:
    name: The sqldeep CLI surfaces transform errors instead of falling through to a misleading raw-SQL parse error
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'Running a sqldeep query in the CLI that parses as sqldeep but is rejected by the transformer (e.g. `FROM t WHERE a = ? SELECT { b: ? }` positional-param reorder, or `SELECT { orders_id } FROM x->orders` unknown alias) prints the sqldeep transform error message, not a generic SQLite ''syntax error / unrecognized token'' message'
    - Genuine non-sqldeep input (dot commands, raw SQL, EXPLAIN) still falls through to raw execution unchanged
    - Covered by a CLI-level test
    context: vendor/src/shell.c (~line 24647) discards the sqldeep error (sdErr) on any transpile failure and falls through to raw SQL, so transform-stage errors surface as confusing SQLite parse errors. Discovered while adding positional-parameter order-preservation (the new guard's clear message is lost in the CLI). The fix must distinguish a parse failure (should fall through) from a transform rejection (should surface) — the C API does not currently expose which stage failed, so this may need an API or heuristic (e.g. surface sdErr only when the raw prepare also fails).
    origin: manual
    discovered: 2026-06-22
  T7:
    name: sqldeep's confirmed Fable-audit defects are remediated (identifier injection, NULL/crash safety, fail-open transpile)
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - 'F1: RECURSE rewrite emits identifiers only via the trusted unparser (no raw string splicing); all identifiers round-trip verbatim and no crafted identifier can alter the re-parsed CTE structure.'
    - 'F2: all XML/JSON runtime functions (and the Swift/Kotlin ports) survive SQL-NULL in any tag/name/key slot with a defined error or defined output, never a process crash; verified across all six drivers.'
    - 'F3: bare-expression transpilation never returns empty/clause-stripped SQL as success — non-unwrappable input yields the original parse error (NULL + err_msg) and the CLI surfaces syntax errors instead of a silent exit-0 no-op.'
    - 'F4: RECURSE produces well-formed, correctly-nested JSON for all supported PK types (negative and 64-bit integers), with non-integer PKs explicitly rejected rather than silently corrupted.'
    - 'The 6 finder-only candidates (FO1-FO6: attribute-buffer sizing, realloc-failure handling, NULL C-API input, C++ exception escape across FFI/cgo/JNI/Swift, per-statement alias scoping, escaped-length int-overflow) are completed through two-lens verification and any confirmed are remediated.'
    context: 'Fable-5 deep audit 2026-07; 4 HIGH findings two-lens confirmed, 0 critical, 0 refuted. Six additional finder-only candidates were throttled and need verification first. Full report: docs/audit/fable-2026-07.md.'
    depends_on:
    - T7.8
    - T7.9
    - T7.10
