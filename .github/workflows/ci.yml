name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cv_asset: cv-0.10.0-linux-amd64.tar.gz
          - os: macos-latest
            cv_asset: cv-0.10.0-darwin-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install cv
        run: |
          curl -fsSL "https://github.com/marcelocantos/cv/releases/download/v0.10.0/${{ matrix.cv_asset }}" \
            | tar xz
          sudo mv cv /usr/local/bin/cv

      - name: Build and run tests
        run: cv test
